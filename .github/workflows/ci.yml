name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: octo
          POSTGRES_PASSWORD: octo
          POSTGRES_DB: octo
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U octo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      BOT_TOKEN: "42:TEST"
      DATABASE_URL: postgresql+asyncpg://octo:octo@localhost:5432/octo
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - name: Ruff
        run: uv run ruff check . && uv run ruff format --check .
      - name: Mypy
        run: uv run mypy
      - name: Shellcheck deploy scripts
        # Ubuntu runner ships shellcheck preinstalled.
        run: shellcheck deploy/*.sh deploy/*/*.sh
      - name: Compose files are valid
        run: |
          cp .env.example .env
          docker compose -f docker-compose.yml config -q
          docker network create remnawave-network
          docker compose -f docker-compose.yml -f deploy/bot/panel-network.yml config -q
          PANEL_DOMAIN=panel.example.com docker compose -f deploy/panel/caddy-compose.yml config -q
          rm .env
      - name: Migrations are up to date
        run: uv run alembic upgrade head && uv run alembic check
      - name: Tests (SQLite)
        run: uv run pytest -q
      - name: Tests (PostgreSQL)
        run: uv run pytest -q
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://octo:octo@localhost:5432/octo
      - name: Docker image builds
        run: docker build -t octo-vpn .
