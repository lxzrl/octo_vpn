services:
  caddy:
    image: caddy:2
    container_name: caddy
    hostname: caddy
    restart: always
    environment:
      PANEL_DOMAIN: ${PANEL_DOMAIN}
    ports:
      - "0.0.0.0:443:443"
      - "0.0.0.0:80:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-ssl-data:/data
    networks:
      - remnawave-network
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "5"

networks:
  remnawave-network:
    name: remnawave-network
    external: true

volumes:
  caddy-ssl-data:
    name: caddy-ssl-data
