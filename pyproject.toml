[project]
name = "octo-vpn"
version = "0.1.0"
description = "Telegram-бот для продажи VPN-подписок"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.13,<4",
    "alembic>=1.13",
    "asyncpg>=0.29",
    "fluent.runtime>=0.4",
    "pydantic-settings>=2.4",
    "redis>=5.0",
    "sqlalchemy[asyncio]>=2.0.30",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.20",
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC", "RUF"]
# Тексты и комментарии на русском: кириллица не «двусмысленные символы».
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"migrations/versions/*" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
packages = ["app"]

[[tool.mypy.overrides]]
module = ["fluent.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
